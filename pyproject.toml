[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pertdiffbench"
version = "0.1.0"
description = "Unified wrapper to benchmark diffusion models for perturbation-response prediction"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "PertDiffBench Team" }]
keywords = ["single-cell", "diffusion", "perturbation", "benchmark"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "numpy",
    "pandas",
    "omegaconf",
    "anndata",
    "scanpy",
    "tqdm",
]

[project.optional-dependencies]
train = ["torch>=2.0"]

[project.scripts]
pertdiffbench = "pertdiffbench.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["pertdiffbench*"]
