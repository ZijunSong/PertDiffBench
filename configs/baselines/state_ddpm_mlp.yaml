model:
  diffusion:
    timesteps: 1000
    beta_1: 1e-4
    beta_T: 0.02
    hidden_dim: 512

  ae:
    input_dim: 6998   # Overridden from adata.n_vars at runtime
    latent_dim: 600   # State SE-600M embedding dim, overridden from data
    hidden_dim: 1024

train:
  batch_size:       512
  device:           "cuda"
  epoch:            1000
  lr:               2e-4
  weight_decay:     1e-4
  grad_clip_norm:   1.0
  warmup_multiplier: 10
  save_weight_dir:  "./checkpoints/state_ddpm_mlp"
  num_workers:      16
  ckpt_save_interval: 500
