model:
  diffusion:
    timesteps: 1000
    beta_1: 1e-4
    beta_T: 0.02
    hidden_dim: 512

  ae:
 input_dim: 6998 # number of genes (train/valid h5ad n_vars); overridden at runtime by data
 latent_dim: 32 # CellFM latent dim; auto-overridden at runtime per X_cellfm
    hidden_dim: 1024

train:
  batch_size:       512
  device:           "cuda"
  epoch:            1000
  lr:               2e-4
  weight_decay:     1e-4
  grad_clip:        1.0
  warmup_multiplier: 10
  save_weight_dir:  "./checkpoints/cellfm_ddpm/latent_ddpm"
  num_workers:      16
  recon_weight:     1.0
  ckpt_save_interval: 500
