model:
  input_dim: 6998
  hidden_dim: 1024

diffusion:
  beta_1: 1e-4
  beta_T: 0.02
  timesteps: 2000

data:
  path: ./dataset/scrna_data/scrna.h5ad
  batch_size: 32
  label_key: perturbation_status

train:
  device: cuda
  epoch: 1000
  batch_size: 2048
  lr: 1e-5
  weight_decay: 1.0e-4
  grad_clip: 1.0
  grad_clip_norm: 1.0
  warmup_multiplier: 10
  save_weight_dir: /data/ppnm/checkpoints/PertDiffBench/checkpoints/sweep/fig2_unseen_cd4t/ddpm__steps__2000/run1
  resume_from: null
  num_workers: 32
  ckpt_save_interval: 100

sample:
  batch_size: 64
  sampled_dir: /data/ppnm/data/PertDiffBench/samples/sweep/fig2_unseen_cd4t/ddpm__steps__2000/run1
  out_h5ad: synthetic_ddpm__steps__2000.h5ad
